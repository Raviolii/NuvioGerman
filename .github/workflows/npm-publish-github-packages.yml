name: Scraper Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Set the environment variable globally for the workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # V4 is compatible with Node 24

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Updated from 20 to 24

      - name: Install dependencies
        run: npm install cheerio-without-node-native

      - name: Run Scraper Test
        run: node test-scraper.js
